services:
  app:
    image: "${COMPOSE_PROJECT_NAME:-kapor}-app:latest"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      network: host
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database
      - ./resources/views:/var/www/html/resources/views:ro
      - ./routes:/var/www/html/routes:ro
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/app-ready"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: unless-stopped

  queue:
    image: "${COMPOSE_PROJECT_NAME:-kapor}-app:latest"
    working_dir: /var/www/html
    command: php artisan queue:work --queue=default --sleep=1 --tries=1 --timeout=900 --max-time=3600
    environment:
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
    volumes:
      - app-public:/var/www/html/public
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database
      - ./resources/views:/var/www/html/resources/views:ro
      - ./routes:/var/www/html/routes:ro
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8001}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx baca file statis dari volume yang sama dengan app
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: kapor
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  app-public:
  app-storage:
  db-data:
  redis-data:
